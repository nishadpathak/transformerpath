name: Directory link check

on:
  schedule:
    # Monday 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  websites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check directory websites
        run: node scripts/weekly-link-check.js
      - name: Upload link report
        uses: actions/upload-artifact@v4
        with:
          name: directory-link-check
          path: data/directory-link-check.json
          if-no-files-found: error
