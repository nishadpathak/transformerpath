name: visible-text
on:
  pull_request:
  push:
    branches: [main, "cursor/**"]
jobs:
  placeholders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/visible-placeholder-text.js
