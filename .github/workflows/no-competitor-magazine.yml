name: no competitor magazine

on:
  pull_request:
  push:
    branches: [main, "cursor/**"]

jobs:
  magazine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/no-competitor-magazine.js
