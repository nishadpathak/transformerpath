name: copper reference

on:
  pull_request:
  push:
    branches: [main, "cursor/**"]

jobs:
  copper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/copper-reference-note.js
