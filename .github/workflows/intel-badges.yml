name: intel-badges

on:
  pull_request:
  push:
    branches: [main, "cursor/**"]

jobs:
  badge-legend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/intel-badge-legend.js
      - run: node tests/intel-equipment-scope.js
