name: netlify-toml

on:
  pull_request:
  push:
    branches: [main, "cursor/**"]

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse netlify.toml
        run: python3 scripts/check-netlify-toml.py
