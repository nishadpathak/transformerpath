name: report-templates
on:
  pull_request:
  push:
    branches: [main, "cursor/**"]
jobs:
  report-templates:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - run: npm ci
    - run: node tests/report-templates.test.js
    - run: node tests/test-report-sample.test.js
