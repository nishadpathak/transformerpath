name: intel-timeline

on:
  pull_request:
  push:
    branches: [main, "cursor/**"]

jobs:
  dedupe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Intel timeline posts are not duplicated
        run: node tests/intel-timeline-dedupe.test.js
