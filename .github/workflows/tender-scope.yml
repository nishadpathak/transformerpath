name: tender-scope
on:
  pull_request:
  push:
    branches: [main, "cursor/**"]
jobs:
  scope-filter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/tender-scope-filter.test.js
