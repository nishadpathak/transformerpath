name: footer-social

on:
  pull_request:
  push:
    branches: [main, "cursor/**"]

jobs:
  footer-social:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fail when a footer repeats a social network
        run: node check-footer-social.js
