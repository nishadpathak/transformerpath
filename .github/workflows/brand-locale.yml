name: brand-locale

on:
  pull_request:
  push:
    branches: [main]

jobs:
  locale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Brand copy does not name Dubai or the UAE
        run: node scripts/check-brand-locale.js
      - name: /llms.txt follows the llmstxt.org file
        run: node tests/llms-txt.test.js
