name: commissioning-jobs
on:
  pull_request:
  push:
    branches: [main, "cursor/**"]
jobs:
  commissioning-jobs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - run: npm ci
    - run: node tests/commissioning-jobs.test.js
