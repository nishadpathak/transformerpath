name: Release Guardian

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: release-guardian
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check production health
        id: check
        run: node scripts/ops-health.js https://transformerpath.com | tee release-guardian.log
      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-guardian-${{ github.run_number }}
          path: release-guardian.log
      - name: Open or update incident issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Release Guardian: production health check failed';
            const body = [
              'Automated health checks detected a production issue.',
              '',
              'Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}',
              '',
              'Review the uploaded release-guardian.log artifact and the live site before changing published data.'
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', per_page: 50
            });
            if (!existing.data.some(i => i.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body
              });
            }
