name: sourced plants

on:
  pull_request:
  push:
    branches: [main, "cursor/**"]

jobs:
  sourced-plants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/sourced-plant-dash.js && node tests/oct-intel-freshness-regression.js
