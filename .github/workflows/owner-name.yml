name: owner-name

on:
  pull_request:
  push:
    branches: [main]

jobs:
  names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Owner name and public HTML phrases
        run: node scripts/check-no-owner-name.js
