name: award-classification
on:
  pull_request:
  push:
    branches: [main, "cursor/**"]
jobs:
  classification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/award-classification.test.js
      - run: node tests/awards-wording-regression.js
