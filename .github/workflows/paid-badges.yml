name: paid-badges
on:
  pull_request:
  push:
    branches: [main, payments-ready, "cursor/**"]
jobs:
  badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node tests/paid-listings.test.js
      - run: node tests/claim-listing.test.js
      - run: node check-paid-badges.js
      - run: node check-verified-ctas.js
      - run: node tests/directory-spec-filters.js
      - run: node check-commerce-features.js
