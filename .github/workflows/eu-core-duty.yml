name: eu-core-duty
on:
  pull_request:
  push:
    branches: [main, "cursor/**"]
jobs:
  eu-core-duty:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - run: node tests/eu-core-duty.test.js
    - run: node tests/factory-slot-rfq.test.js
