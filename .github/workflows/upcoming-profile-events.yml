name: upcoming-profile-events
on:
  pull_request:
  push:
    branches: [main, "cursor/**"]
jobs:
  upcoming:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/upcoming-profile-events.js
      - run: node tests/past-events-regression.js
