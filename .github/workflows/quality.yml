name: Site quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node check-config.js
      - run: node check-links.js
      - run: node tests/check-p0-integrity.js
      - run: node tests/check-account-schema.js
      - run: node build-dist.js
