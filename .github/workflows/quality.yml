name: Site quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node check-config.js
      - run: node check-links.js
      - run: node tests/check-p0-integrity.js
      - run: node tests/check-account-schema.js
      - run: node build-dist.js
      - name: Assert clean public artifact (no admin or private files in dist)
        run: |
          test ! -f dist/admin.html
          test ! -d dist/admin
          test ! -d dist/_private
          echo "✓ dist/ contains no admin or private surfaces"
      - name: Assert repo hygiene (no .DS_Store tracked)
        run: |
          if [ -f .DS_Store ]; then
            echo "Error: .DS_Store tracked in repo root" && exit 1
          fi
          echo "✓ Repository hygiene clean"

