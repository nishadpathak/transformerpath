<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline — TransformerPath</title>
<meta name="description" content="You're offline. Reconnect to browse TransformerPath — daily transformer industry intelligence.">
<meta name="robots" content="noindex">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0d1b2e;color:#e5e7eb;font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Noto Sans Arabic", "Noto Sans SC", "Noto Sans JP", "Noto Sans Devanagari", sans-serif;text-align:center;padding:24px}
  .wrap{max-width:440px}
  .mark{font-size:1.6rem;font-weight:800;letter-spacing:-.4px}
  .mark span{color:#f5a623}
  .bolt{font-size:2.6rem;margin:20px 0 6px;filter:drop-shadow(0 0 14px rgba(245,166,35,.5))}
  h1{font-size:1.5rem;margin:10px 0 8px}
  p{color:#9fb0c4;line-height:1.6;margin:0 0 24px}
  .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  a.btn,button.btn{display:inline-block;background:#f5a623;color:#0d1b2e;font-weight:800;text-decoration:none;padding:12px 22px;border-radius:999px;border:0;cursor:pointer;font:inherit;font-size:.95rem}
  button.ghost{background:none;border:1px solid #33465f;color:#e5e7eb}
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">Transformer<span>Path</span></div>
    <div class="bolt">⚡</div>
    <h1>You're offline</h1>
    <p>This page isn't available without a connection. Check your network and try again — pages you've already visited still work offline.</p>
    <div class="actions">
      <button class="btn ghost" onclick="location.reload()">Retry</button>
      <a class="btn" href="index.html">Go to homepage</a>
    </div>
  </div>
</body>
</html>
