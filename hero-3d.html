<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TransformerPath — Hero 3D</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07111c; }
  #stage { position: absolute; inset: 0; cursor: grab; }
  #stage.dragging { cursor: grabbing; }
  .veil {
    position: absolute; inset: 0; pointer-events: none; z-index: 2;
    background:
      radial-gradient(ellipse 70% 60% at 72% 48%, transparent 0%, rgba(7,17,28,.18) 55%, rgba(7,17,28,.55) 100%),
      linear-gradient(90deg, rgba(7,17,28,.72) 0%, rgba(7,17,28,.35) 38%, rgba(7,17,28,.08) 62%, transparent 100%);
  }
  .boot {
    position: absolute; inset: 0; z-index: 3; display: grid; place-items: center;
    color: #9fb0c4; font: 600 0.9rem/1.4 system-ui, sans-serif; letter-spacing: 0.04em;
    background: #07111c; transition: opacity .45s ease;
  }
  .boot.is-done { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
  <div id="stage" role="img" aria-label="Interactive 3D power transformer"></div>
  <div class="veil" aria-hidden="true"></div>
  <div class="boot" id="boot">Loading 3D model…</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="tp-3d-core.js"></script>
  <script src="tp-power-assembly.js"></script>
  <script>
  (function () {
    var params = new URLSearchParams(location.search);
    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var auto = params.get('spin') !== '0' && !reduced;
    var stage = document.getElementById('stage');

    var engine = TP3D.bootstrap(stage, {
      shadows: false,
      labels: false,
      ground: false,
      fog: true,
      fogNear: 160,
      fogFar: 420,
      bg: 0x07111c,
      distance: 148,
      theta: 0.95,
      phi: 1.12,
      target: { x: 0, y: 24, z: 0 }
    });

    var assembly = TPPowerAssembly.build(engine);
    if (assembly && assembly.setTankOpacity) assembly.setTankOpacity(0.28);

    engine.setLabels(false);
    engine.setAutoRotate(auto);

    if (!reduced && params.get('pulse') !== '0') {
      var t0 = performance.now();
      engine.setOnTick(function () {
        if (stage.classList.contains('dragging')) return;
        var t = (performance.now() - t0) / 1000;
        var e = 0.08 + 0.07 * (0.5 + 0.5 * Math.sin(t * 0.55));
        engine.setExplode(e);
      });
    }

    var boot = document.getElementById('boot');
    requestAnimationFrame(function () {
      setTimeout(function () { boot.classList.add('is-done'); }, 280);
    });

    var idleTimer;
    function bump() {
      engine.setAutoRotate(false);
      clearTimeout(idleTimer);
      if (!auto) return;
      idleTimer = setTimeout(function () { engine.setAutoRotate(true); }, 4200);
    }
    ['pointerdown', 'wheel', 'touchstart'].forEach(function (ev) {
      stage.addEventListener(ev, bump, { passive: true });
    });
  })();
  </script>
</body>
</html>
