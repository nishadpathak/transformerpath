[build]
  command = "echo 'Static site with serverless functions'"
  publish = "."
  functions = "functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["express"]

[[functions]]
  name = "refresh-data"
  schedule = "0 6 * * *"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api:splat"
  status = 200
