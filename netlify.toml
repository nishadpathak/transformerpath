[build]
  command = "echo 'Static site with serverless functions'"
  publish = "."
  functions = "functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["express"]

[functions."refresh-data"]
  schedule = "0 6 * * *"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api:splat"
  status = 200

# Long-lived caching for static assets; HTML stays revalidated so daily intel is never stale.
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
