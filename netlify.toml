[build]
  command = "echo 'Static site with serverless functions'"
  publish = "."
  functions = "functions"

[functions]
  node_bundler = "esbuild"

[functions."refresh-data"]
  schedule = "0 6 * * *"

# ── Keep internal docs off the public site ──────────────────────────────
# publish = "." deploys the whole folder, so the internal strategy/setup
# markdown and the stale archive/ copies would otherwise be fetchable
# directly (e.g. /PREMIUM-PRICING-STRATEGY.md). Serve 404 instead.
[[redirects]]
  from = "/*.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/archive/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/_partials/*"
  to = "/404.html"
  status = 404
  force = true

# Long-lived caching for static assets; HTML stays revalidated so daily intel is never stale.
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
