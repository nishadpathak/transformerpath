# Security headers. The CSP stays permissive on purpose: pages use inline
# scripts and styles, and the browser also calls Stripe, Supabase, Google
# Analytics, fonts and ipapi. A tight allow-list would blank those calls.
# https: keeps that working. The AdSense / Funding Choices hosts are named
# explicitly so a later tightening does not drop them:
#   pagead2.googlesyndication.com  tpc.googlesyndication.com
#   googleads.g.doubleclick.net    ad.doubleclick.net
#   fundingchoicesmessages.google.com  partner.googleadservices.com
#   adservice.google.com  www.googleadservices.com  ep1.adtrafficquality.google
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://pagead2.googlesyndication.com https://tpc.googlesyndication.com https://googleads.g.doubleclick.net https://ad.doubleclick.net https://fundingchoicesmessages.google.com https://partner.googleadservices.com https://adservice.google.com https://www.googleadservices.com https://ep1.adtrafficquality.google https: blob:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https://pagead2.googlesyndication.com https://tpc.googlesyndication.com https://googleads.g.doubleclick.net https://ad.doubleclick.net https:; font-src 'self' data: https:; connect-src 'self' https://pagead2.googlesyndication.com https://tpc.googlesyndication.com https://googleads.g.doubleclick.net https://ad.doubleclick.net https://fundingchoicesmessages.google.com https://adservice.google.com https://ep1.adtrafficquality.google https: wss:; frame-src 'self' https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://pagead2.googlesyndication.com https://fundingchoicesmessages.google.com https://www.google.com https:; media-src 'self' data: blob: https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https:"

# Long-lived caching for static assets; HTML stays revalidated so daily intel is never stale.
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/build.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Root-level CSS/JS had no cache policy, so browsers applied their own
# heuristic and returning visitors could sit on a stale stylesheet. Revalidate
# these; the ?v= query on the tag is what forces a fresh copy after a change.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

