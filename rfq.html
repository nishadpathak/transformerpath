<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post an RFQ — TransformerInsider</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="container nav">
    <a href="index.html" class="logo">Transformer<span>Insider</span></a>
    <button class="menu-toggle" onclick="document.querySelector('.nav-links').classList.toggle('open')">☰</button>
    <nav class="nav-links">
      <a href="intel.html">Daily Intel</a>
      <a href="events.html">Events</a>
      <a href="jobs.html">Jobs</a>
      <a href="learn.html">Learn</a>
      <a href="grids.html">Grids</a>
      
      <a href="resources.html">Resources</a>
      <a href="sponsor.html">Sponsor</a>
      <a href="intel.html" class="btn btn-amber">Subscribe</a>
    </nav>
  </div>
</header>

<section class="hero" style="padding:50px 0 40px">
  <div class="container">
    <h1 style="font-size:2.2rem">Post an <span>RFQ</span></h1>
    <p>Describe your requirement and reach verified GCC transformer suppliers — free.</p>
  </div>
</section>

<section class="block">
  <div class="container" style="max-width:720px">
    <div class="card">
      <form onsubmit="alert('Prototype — submissions will be wired to your email / database at launch.'); return false;">
        <div class="row">
          <div><label>Your Name *</label><input type="text" required placeholder="Full name"></div>
          <div><label>Company *</label><input type="text" required placeholder="Company name"></div>
        </div>
        <div class="row">
          <div><label>Email *</label><input type="email" required placeholder="you@company.com"></div>
          <div><label>Phone / WhatsApp</label><input type="tel" placeholder="+971 ..."></div>
        </div>
        <div class="row">
          <div><label>Country *</label>
            <select required>
              <option value="">Select...</option>
              <option>UAE</option><option>Saudi Arabia</option><option>Qatar</option>
              <option>Oman</option><option>Kuwait</option><option>Bahrain</option><option>Other</option>
            </select>
          </div>
          <div><label>Category *</label>
            <select required>
              <option value="">Select...</option>
              <option>Power Transformer</option><option>Distribution Transformer</option>
              <option>Bushings</option><option>Tap-Changers (OLTC/DETC)</option>
              <option>Insulation Materials</option><option>Transformer Oil</option>
              <option>Radiators / Cooling</option><option>Monitoring & Protection</option>
              <option>Testing / Services</option><option>Other</option>
            </select>
          </div>
        </div>
        <div style="margin-bottom:16px"><label>Requirement Details *</label>
          <textarea rows="5" required placeholder="Specs, quantity, standards (IEC/ANSI), delivery location, timeline..."></textarea>
        </div>
        <div class="row">
          <div><label>Target Delivery</label><input type="text" placeholder="e.g. Q4 2026"></div>
          <div><label>Budget (optional)</label><input type="text" placeholder="USD / AED"></div>
        </div>
        <button class="btn btn-amber" type="submit" style="width:100%">Submit RFQ →</button>
        <p style="text-align:center; color:var(--muted); font-size:.85rem; margin-top:12px">Your RFQ is shared only with verified, relevant suppliers.</p>
      </form>
    </div>
  </div>
</section>

<footer>
  <div class="container"><div class="copyright">© 2026 TransformerInsider.</div></div>
</footer>

</body>
</html>
