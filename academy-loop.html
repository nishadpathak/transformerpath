<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academy loop — READ · WATCH · EXPLORE · CALCULATE · SIMULATE · TEST | TransformerPath</title>
<meta name="description" content="A TransformerPath Academy learning loop: read, watch a 4–10 minute concept, explore in 3D, calculate, simulate in Grid Lab, then test. Videos complement 3D Labs. Course completion record, not a qualification.">
<link rel="canonical" href="https://transformerpath.com/academy-loop.html">
<link rel="stylesheet" href="style.css?v=14">
<link rel="stylesheet" href="tp-nav.css?v=14">
<link rel="icon" type="image/svg+xml" href="brand/favicon.svg">
<style>
.ws-wrap{max-width:820px;margin:0 auto;padding:42px 20px 90px}
.ws-sub{color:var(--muted);font-size:.92rem;line-height:1.55}
.ac-spine{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:14px 0 22px}
.ac-spine span{font-size:.72rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--border);border-radius:999px;padding:4px 10px;color:var(--muted)}
.ac-arrow{border:0 !important;padding:0 2px !important;color:var(--amber) !important}
.ac-steps{list-style:none;padding:0;margin:0}
.ac-step{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.ac-kind{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);margin-bottom:6px}
.ac-step h2{font-size:1.12rem;margin:0 0 8px;color:var(--ink)}
.ac-step ul{margin:0 0 10px 18px;color:var(--text)}
.ac-player{background:var(--bg);border:1px dashed var(--border);border-radius:10px;padding:12px;margin:8px 0}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header>
  <div class="container nav">
    <a href="index.html" class="logo" style="display:inline-flex;align-items:center;gap:9px"><span class="word">Transformer<span class="accent">Path</span></span></a>
    <nav class="tpnav" id="mainNav" aria-label="Primary">
      <a href="learn.html">Learn</a>
      <a href="academy.html">Academy</a>
      <a href="grid-lab.html">Grid Lab</a>
      <a href="workspace.html" data-tp-account>My TransformerPath</a>
    </nav>
  </div>
  <script src="tp-nav.js?v=7" defer></script>
</header>
<main id="main" class="ws-wrap">
  <div id="loopRoot"><p class="ws-sub">Loading loop…</p></div>
</main>
<script src="supabase-config.js"></script>
<script src="supabase.js" defer></script>
<script src="tp-learner.js" defer></script>
<script src="tp-academy.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', function(){
  fetch('data/academy-loops.json', { cache: 'no-cache' }).then(function(r){ return r.json(); }).then(function(d){
    var id = window.TP_ACADEMY ? TP_ACADEMY.loopIdFromLocation() : (new URLSearchParams(location.search).get('id')||'');
    if (!id) { location.replace('academy.html'); return; }
    document.title = id + ' — Academy loop | TransformerPath';
    TP_ACADEMY.renderLoop(document.getElementById('loopRoot'), d, id);
  }).catch(function(){
    document.getElementById('loopRoot').innerHTML = '<p>Could not load academy loops. Open <a href="academy.html">Academy</a>.</p>';
  });
});
</script>
</body>
</html>
