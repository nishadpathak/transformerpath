<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Intel — TransformerPath</title>
  <style>
    :root {
      --primary: #3da5f4;
      --primary-dark: #0b5fa5;
      --accent: #e8732a;
      --text: #e8eef5;
      --text-muted: #8fa6bc;
      --bg-dark: #0a1624;
      --bg-card: #0d1b2e;
      --border: #23415e;
      --success: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(180deg, #27557f 0%, #143049 38%, #0c1c30 70%, #0a1624 100%);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: rgba(13, 27, 46, 0.9);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(8px);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.5px;
      text-decoration: none;
      color: var(--text);
    }

    .logo svg {
      width: 24px;
      height: 24px;
    }

    .logo .name {
      background: linear-gradient(90deg, #fff, #9fd4ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .logo .accent {
      color: var(--accent);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .nav-links {
      display: flex;
      gap: 24px;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--text);
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    .page-header {
      margin-bottom: 40px;
    }

    .kicker {
      color: var(--accent);
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .page-title {
      font-size: 36px;
      font-weight: 800;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #fff, #9fd4ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .page-subtitle {
      color: var(--text-muted);
      font-size: 14px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
      margin-bottom: 40px;
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 12px 16px 12px 40px;
      background: rgba(13, 27, 46, 0.7);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      transition: all 0.3s;
    }

    .search-box input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(61, 165, 244, 0.1);
    }

    .search-box::before {
      content: '🔍';
      position: absolute;
      left: 12px;
      top: 12px;
      pointer-events: none;
    }

    .filter-select {
      padding: 12px 16px;
      background: rgba(13, 27, 46, 0.7);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .filter-select:hover,
    .filter-select:focus {
      border-color: var(--primary);
      outline: none;
    }

    .sort-select {
      padding: 12px 16px;
      background: rgba(13, 27, 46, 0.7);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
    }

    .articles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 24px;
      margin-bottom: 40px;
    }

    .article-card {
      background: rgba(13, 27, 46, 0.7);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.3s;
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .article-card:hover {
      transform: translateY(-8px);
      border-color: var(--primary);
      box-shadow: 0 20px 60px rgba(61, 165, 244, 0.15);
    }

    .article-image {
      width: 100%;
      height: 180px;
      background: linear-gradient(135deg, rgba(61, 165, 244, 0.2), rgba(232, 115, 42, 0.2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      border-bottom: 1px solid var(--border);
    }

    .article-content {
      padding: 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .article-meta {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .article-tag {
      display: inline-block;
      background: rgba(61, 165, 244, 0.15);
      color: #9fd4ff;
      border: 1px solid rgba(61, 165, 244, 0.35);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .article-tag.region {
      background: rgba(232, 115, 42, 0.15);
      color: #ffa366;
      border-color: rgba(232, 115, 42, 0.35);
    }

    .article-date {
      color: var(--text-muted);
      font-size: 12px;
      margin-bottom: 8px;
    }

    .article-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text);
      line-height: 1.4;
      flex: 1;
    }

    .article-excerpt {
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 16px;
      flex: 1;
    }

    .article-source {
      color: var(--text-muted);
      font-size: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .article-source strong {
      color: var(--primary);
    }

    .read-more {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 12px;
      transition: color 0.2s;
    }

    .read-more:hover {
      color: #5eb8ff;
    }

    .premium-badge {
      display: inline-block;
      background: rgba(232, 115, 42, 0.15);
      color: #ffa366;
      border: 1px solid rgba(232, 115, 42, 0.35);
      font-size: 10px;
      font-weight: 700;
      padding: 3px 6px;
      border-radius: 4px;
      margin-left: 8px;
      text-transform: uppercase;
    }

    .blurred-content {
      position: relative;
      filter: blur(3px);
      pointer-events: none;
      opacity: 0.6;
    }

    .blur-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(13, 27, 46, 0.7);
      backdrop-filter: blur(3px);
      border-radius: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
    }

    .no-articles {
      text-align: center;
      padding: 60px 40px;
      background: rgba(13, 27, 46, 0.7);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text-muted);
    }

    .no-articles-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }

    .pagination {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 40px;
    }

    .pagination button {
      padding: 8px 16px;
      background: rgba(13, 27, 46, 0.7);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .pagination button:hover:not(:disabled) {
      border-color: var(--primary);
      color: var(--primary);
    }

    .pagination button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .pagination button.active {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    @media (max-width: 1024px) {
      .articles-grid {
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      }

      .controls {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      .articles-grid {
        grid-template-columns: 1fr;
      }

      .page-title {
        font-size: 24px;
      }

      main {
        padding: 20px 16px;
      }

      .nav-links {
        display: none;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <a href="/" class="logo">
        <svg width="24" height="24" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="32" r="27" fill="none" stroke="#fff" stroke-width="2"/>
          <path d="M37 9 L23 35 L31 35 L26 55 L42 29 L34 29 L40 9 Z" fill="#f5a623"/>
        </svg>
        <span class="name">Trafo<span class="accent">Path</span></span>
      </a>
    </div>
    <div class="header-right">
      <div class="nav-links">
        <a href="/learn.html">Learn</a>
        <a href="/tools.html">Tools</a>
        <a href="/events.html">Events</a>
        <a href="/manufacturers.html">Manufacturers</a>
      </div>
      <a href="/dashboard.html" style="color: var(--text-muted); text-decoration: none; font-size: 13px; font-weight: 600;">Dashboard</a>
    </div>
  </header>

  <main>
    <div class="page-header">
      <div class="kicker">Market Intelligence</div>
      <h1 class="page-title">Daily Intel</h1>
      <p class="page-subtitle">Stay updated with the latest transformer industry news, trends, and market insights</p>
    </div>

    <div class="controls">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search articles..." oninput="handleSearch()">
      </div>
      <select id="categoryFilter" class="filter-select" onchange="handleFilter()">
        <option value="">All Categories</option>
        <option value="News">News</option>
        <option value="Market">Market Trends</option>
        <option value="Technology">Technology</option>
        <option value="Supply Chain">Supply Chain</option>
        <option value="Regulations">Regulations</option>
        <option value="Industry">Industry Reports</option>
      </select>
      <select id="regionFilter" class="filter-select" onchange="handleFilter()">
        <option value="">All Regions</option>
        <option value="North America">North America</option>
        <option value="Europe">Europe</option>
        <option value="Asia">Asia</option>
        <option value="Middle East">Middle East</option>
        <option value="Africa">Africa</option>
        <option value="South America">South America</option>
      </select>
    </div>

    <div id="articlesList" class="articles-grid">
      <div class="loading">Loading latest articles...</div>
    </div>

    <div class="pagination" id="pagination" style="display: none;"></div>
  </main>

  <script>
    const API_BASE = '/api';
    let currentPage = 1;
    const articlesPerPage = 12;
    let allArticles = [];

    async function loadArticles() {
      try {
        const token = localStorage.getItem('tp-token');
        const headers = token ? { 'Authorization': `Bearer ${token}` } : {};

        const response = await fetch(`${API_BASE}/articles`, { headers });
        if (!response.ok) throw new Error('Failed to load articles');

        const articles = await response.json();
        allArticles = articles;
        displayArticles(articles);
      } catch (error) {
        console.error('Error loading articles:', error);
        document.getElementById('articlesList').innerHTML = `
          <div class="no-articles">
            <div class="no-articles-title">Unable to Load Articles</div>
            <p>Please try again later</p>
          </div>
        `;
      }
    }

    function displayArticles(articles) {
      if (articles.length === 0) {
        document.getElementById('articlesList').innerHTML = `
          <div class="no-articles">
            <div class="no-articles-title">No Articles Found</div>
            <p>Try adjusting your search or filters</p>
          </div>
        `;
        return;
      }

      const startIdx = (currentPage - 1) * articlesPerPage;
      const endIdx = startIdx + articlesPerPage;
      const paginatedArticles = articles.slice(startIdx, endIdx);

      const html = paginatedArticles.map(article => `
        <div class="article-card" onclick="openArticle(${article.id})">
          <div class="article-image">
            ${getIcon(article.category)}
          </div>
          <div class="article-content">
            <div class="article-meta">
              <span class="article-tag">${article.category || 'News'}</span>
              <span class="article-tag region">${article.region || 'Global'}</span>
              ${article.is_premium ? '<span class="premium-badge">Pro</span>' : ''}
            </div>
            <div class="article-date">${formatDate(article.published_date)}</div>
            <h3 class="article-title">${article.title}</h3>
            <p class="article-excerpt">${article.excerpt || article.content?.substring(0, 100) + '...'}</p>
            <div class="article-source">
              <strong>${article.source}</strong> •
              <a href="#" class="read-more">Read More →</a>
            </div>
          </div>
        </div>
      `).join('');

      document.getElementById('articlesList').innerHTML = html;

      // Show pagination if needed
      const totalPages = Math.ceil(articles.length / articlesPerPage);
      if (totalPages > 1) {
        showPagination(totalPages, articles.length);
      } else {
        document.getElementById('pagination').style.display = 'none';
      }
    }

    function getIcon(category) {
      const icons = {
        'News': '📰',
        'Market': '📊',
        'Technology': '⚡',
        'Supply Chain': '🚚',
        'Regulations': '📋',
        'Industry': '🏭'
      };
      return icons[category] || '📰';
    }

    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString('en-US', {
        year: 'numeric',
        month: 'short',
        day: 'numeric'
      });
    }

    function handleSearch() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allArticles.filter(article =>
        article.title.toLowerCase().includes(query) ||
        article.excerpt?.toLowerCase().includes(query)
      );
      currentPage = 1;
      displayArticles(filtered);
    }

    function handleFilter() {
      const category = document.getElementById('categoryFilter').value;
      const region = document.getElementById('regionFilter').value;

      const filtered = allArticles.filter(article => {
        const matchCategory = !category || article.category === category;
        const matchRegion = !region || article.region === region;
        return matchCategory && matchRegion;
      });

      currentPage = 1;
      displayArticles(filtered);
    }

    function showPagination(totalPages, totalArticles) {
      const paginationDiv = document.getElementById('pagination');
      let html = '';

      if (currentPage > 1) {
        html += `<button onclick="goToPage(${currentPage - 1})">← Previous</button>`;
      }

      for (let i = 1; i <= totalPages; i++) {
        if (i === currentPage) {
          html += `<button class="active">${i}</button>`;
        } else if (i <= 5 || i > totalPages - 2 || Math.abs(i - currentPage) <= 1) {
          html += `<button onclick="goToPage(${i})">${i}</button>`;
        } else if (i === 6 && currentPage > 5) {
          html += `<button disabled>...</button>`;
        }
      }

      if (currentPage < totalPages) {
        html += `<button onclick="goToPage(${currentPage + 1})">Next →</button>`;
      }

      paginationDiv.innerHTML = html;
      paginationDiv.style.display = 'flex';
    }

    function goToPage(page) {
      currentPage = page;
      displayArticles(allArticles);
      window.scrollTo(0, 0);
    }

    function openArticle(articleId) {
      // TODO: Navigate to full article page
      alert(`Article ${articleId} - Full article view coming soon`);
    }

    // Load articles on page load
    window.addEventListener('load', loadArticles);
  </script>
</body>
</html>
