<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment received — TransformerPath</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://transformerpath.com/checkout-success.html">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/svg+xml" href="brand/favicon.svg"><link rel="icon" href="brand/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
</head>
<body data-tp-node="checkout-success">
<header>
  <div class="container nav">
    <a href="index.html" class="logo" style="display:inline-flex;align-items:center;gap:9px"><svg width="30" height="30" viewBox="0 0 64 64" aria-hidden="true" style="flex:none"><g fill="none" stroke="#f5a623" stroke-width="3.6" stroke-linecap="round"><path d="M21 16 a5.2 5.2 0 0 1 0 10.4 a5.2 5.2 0 0 1 0 10.4 a5.2 5.2 0 0 1 0 10.4"/><path d="M43 16 a5.2 5.2 0 0 0 0 10.4 a5.2 5.2 0 0 0 0 10.4 a5.2 5.2 0 0 0 0 10.4"/></g><g stroke="#fff" stroke-width="2.8" stroke-linecap="round"><line x1="30" y1="14" x2="30" y2="50"/><line x1="34" y1="14" x2="34" y2="50"/></g></svg>Transformer<span>Path</span></a>
  </div>
</header>

<section class="block">
  <div class="container" style="max-width:640px;text-align:center;padding:60px 20px">
    <div style="font-size:3rem;margin-bottom:12px">✅</div>
    <h1 style="font-size:2rem;margin-bottom:12px">Payment received</h1>
    <p id="msg" style="color:var(--muted);font-size:1.05rem;line-height:1.6;margin-bottom:28px">
      Thanks — your checkout completed. We’ll email confirmation and activate your listing or sponsorship within one business day.
    </p>
    <p id="skuLine" style="font-weight:700;color:var(--ink);margin-bottom:28px"></p>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <a class="btn btn-amber" href="list-company.html">Directory listing</a>
      <a class="btn" href="sponsor.html" style="background:var(--navy);color:#fff">Sponsorships</a>
      <a class="btn" href="index.html">Home</a>
    </div>
    <p style="margin-top:28px;font-size:.88rem;color:var(--muted)">
      Questions? <a href="mailto:hello@transformerpath.com" style="color:var(--accent);font-weight:600">hello@transformerpath.com</a>
    </p>
  </div>
</section>

<script src="payments-config.js"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var sku = params.get('sku');
  var sessionId = params.get('session_id');
  var p = sku && window.TP_PAYMENTS && TP_PAYMENTS.get(sku);
  if (p) {
    document.getElementById('skuLine').textContent = p.name + ' — ' + p.displayPrice + p.displayPeriod;
    document.getElementById('msg').textContent =
      'Thanks for purchasing ' + p.name + '. We’ll confirm by email and activate within one business day.';
  }
  try {
    localStorage.setItem('tp-last-purchase', JSON.stringify({
      sku: sku || null,
      session_id: sessionId || null,
      paid_at: new Date().toISOString()
    }));
  } catch (e) {}
})();
</script>
<script src="analytics.js" defer></script>
<script src="site-graph.js" defer></script>
</body>
</html>
