<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — TransformerPath</title>
  <style>
    :root {
      --primary: #3da5f4;
      --primary-dark: #0b5fa5;
      --accent: #e8732a;
      --text: #e8eef5;
      --text-muted: #8fa6bc;
      --bg-dark: #0a1624;
      --bg-card: #0d1b2e;
      --border: #23415e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0a1624 0%, #0d1b2e 50%, #0a1624 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .logo-area {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 20px;
    }

    .logo svg {
      width: 32px;
      height: 32px;
    }

    .logo .name {
      background: linear-gradient(90deg, #fff, #9fd4ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .logo .accent {
      color: var(--accent);
    }

    .logo-area p {
      color: var(--text-muted);
      font-size: 14px;
    }

    .card {
      background: rgba(13, 27, 46, 0.8);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px;
      backdrop-filter: blur(8px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      background: rgba(23, 41, 63, 0.6);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      transition: all 0.3s;
    }

    input[type="email"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(23, 41, 63, 0.8);
      box-shadow: 0 0 0 3px rgba(61, 165, 244, 0.1);
    }

    input::placeholder {
      color: var(--text-muted);
    }

    .remember-forgot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-bottom: 24px;
    }

    .checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .checkbox input {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .forgot-link {
      color: var(--primary);
      text-decoration: none;
      transition: color 0.2s;
    }

    .forgot-link:hover {
      color: #5eb8ff;
      text-decoration: underline;
    }

    .btn {
      width: 100%;
      padding: 12px 24px;
      background: linear-gradient(135deg, var(--primary) 0%, #1e7fb8 100%);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 16px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(61, 165, 244, 0.4);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--primary);
      color: var(--primary);
    }

    .btn-secondary:hover {
      background: rgba(61, 165, 244, 0.1);
    }

    .divider {
      text-align: center;
      margin: 24px 0;
      color: var(--text-muted);
      font-size: 13px;
      position: relative;
    }

    .divider::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      width: 100%;
      height: 1px;
      background: var(--border);
    }

    .divider span {
      background: var(--bg-card);
      padding: 0 12px;
      position: relative;
      z-index: 1;
    }

    .social-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .social-btn {
      padding: 10px;
      background: rgba(23, 41, 63, 0.6);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .social-btn:hover {
      background: rgba(23, 41, 63, 0.9);
      border-color: var(--primary);
    }

    .signup-link {
      text-align: center;
      font-size: 14px;
      color: var(--text-muted);
    }

    .signup-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }

    .signup-link a:hover {
      color: #5eb8ff;
      text-decoration: underline;
    }

    .error-message {
      padding: 12px 16px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      color: #fca5a5;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
      animation: slideIn 0.3s ease-out;
    }

    .success-message {
      padding: 12px 16px;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-radius: 8px;
      color: #86efac;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      .card {
        padding: 32px 24px;
      }

      h1 {
        font-size: 20px;
      }

      .social-buttons {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-area">
      <div class="logo">
        <svg width="32" height="32" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="32" r="27" fill="none" stroke="#fff" stroke-width="2"/>
          <path d="M37 9 L23 35 L31 35 L26 55 L42 29 L34 29 L40 9 Z" fill="#f5a623"/>
        </svg>
        <span class="name">Trafo<span class="accent">Path</span></span>
      </div>
      <p>Transformer Industry Intelligence & Learning</p>
    </div>

    <div class="card">
      <h1>Welcome back</h1>
      <p class="subtitle">Log in to access your courses, daily intel, and design tools</p>

      <div class="error-message" id="errorMsg"></div>
      <div class="success-message" id="successMsg"></div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@company.com"
            required
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          >
        </div>

        <div class="remember-forgot">
          <label class="checkbox">
            <input type="checkbox" id="remember" name="remember">
            <span>Remember me</span>
          </label>        </div>

        <button type="submit" class="btn" id="loginBtn">Sign In</button>
      </form>

      <div class="divider">
        <span>or continue with</span>
      </div>

      <div class="social-buttons">
        <button type="button" class="social-btn" onclick="handleGoogleLogin()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="display: inline; margin-right: 6px;">
            <path d="M23 12a11 11 0 0 1-10 10.999 11 11 0 0 1-8-14.999 11 11 0 0 1 18.8-2"/>
          </svg>
          Google
        </button>
        <button type="button" class="social-btn" onclick="handleMicrosoftLogin()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display: inline; margin-right: 6px;">
            <rect x="3" y="3" width="8" height="8" fill="currentColor"/>
            <rect x="13" y="3" width="8" height="8" fill="currentColor"/>
            <rect x="3" y="13" width="8" height="8" fill="currentColor"/>
            <rect x="13" y="13" width="8" height="8" fill="currentColor"/>
          </svg>
          Microsoft
        </button>
      </div>

      <div class="signup-link">
        Don't have an account? <a href="register.html">Sign up</a>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = '/api';

    function showError(message) {
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.textContent = message;
      errorMsg.style.display = 'block';
      setTimeout(() => errorMsg.style.display = 'none', 5000);
    }

    function showSuccess(message) {
      const successMsg = document.getElementById('successMsg');
      successMsg.textContent = message;
      successMsg.style.display = 'block';
    }

    async function handleLogin(event) {
      event.preventDefault();
      const loginBtn = document.getElementById('loginBtn');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const remember = document.getElementById('remember').checked;

      if (!email || !password) {
        showError('Please enter email and password');
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing in...';

      try {
        const response = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          showError(data.message || 'Login failed. Please check your credentials.');
          loginBtn.disabled = false;
          loginBtn.textContent = 'Sign In';
          return;
        }

        // Store token
        localStorage.setItem('tp-token', data.token);
        localStorage.setItem('tp-user', JSON.stringify(data.user));

        if (remember) {
          localStorage.setItem('tp-remember-email', email);
        }

        showSuccess('Login successful! Redirecting...');
        setTimeout(() => {
          window.location.href = '/dashboard.html';
        }, 1500);
      } catch (error) {
        showError('Network error. Please try again.');
        console.error('Login error:', error);
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign In';
      }
    }

    function handleGoogleLogin() {
      // TODO: Implement Google OAuth
      showError('Google login coming soon');
    }

    function handleMicrosoftLogin() {
      // TODO: Implement Microsoft OAuth
      showError('Microsoft login coming soon');
    }

    // Pre-fill email if remembered
    window.addEventListener('load', () => {
      const rememberedEmail = localStorage.getItem('tp-remember-email');
      if (rememberedEmail) {
        document.getElementById('email').value = rememberedEmail;
        document.getElementById('remember').checked = true;
      }

      // Check if already logged in
      const token = localStorage.getItem('tp-token');
      if (token) {
        window.location.href = '/dashboard.html';
      }
    });
  </script>
</body>
</html>
